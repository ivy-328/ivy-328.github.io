{% assign p = site.data.profile %}
<header class="nju-header">
  <div class="nju-header__inner">
    <a class="nju-brand" href="{% if page.lang == 'zh' %}/zh/{% else %}/{% endif %}" aria-label="Caihang Liang home">
      <img class="nju-brand__logo" src="{{ p.nju_logo_url }}" alt="Nanjing University" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="nju-brand__fallback"><span class="nju-shield">N</span><span><b>南京大学</b><small>NANJING UNIVERSITY</small></span></span>
      <span class="nju-brand__person"><b>{{ p.name_zh }}</b><small>{{ p.name_en }}</small></span>
    </a>
    <button class="nju-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="nju-nav" aria-label="Primary navigation">
      {% if page.lang == 'zh' %}
        <a href="/zh/">主页</a><a href="/zh/#about">关于</a><a href="/zh/research/">研究</a><a href="/zh/practice/">实践</a><a href="/zh/work/">作品</a><a href="/">EN</a>
      {% else %}
        <a href="/">Home</a><a href="/#about">About</a><a href="/research/">Research</a><a href="/practice/">Practice</a><a href="/work/">Work</a><a href="/zh/">中文</a>
      {% endif %}
    </nav>
  </div>
</header>
